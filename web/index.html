<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciamento de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Gerenciamento de Tarefas</h1>
  <nav>
    <a href="#" data-tela="usuarios">Cadastro de Usuários</a>
    <a href="#" data-tela="tarefas">Cadastro de Tarefas</a>
    <a href="#" data-tela="gerenciar">Gerenciar Tarefas</a>
  </nav>
</header>

<main>

 
  <section id="tela-gerenciar" class="tela">
    <h2>Tarefas</h2>
    <div class="colunas">
      <div><h3>A Fazer</h3><div id="A_FAZER"></div></div>
      <div><h3>Fazendo</h3><div id="FAZENDO"></div></div>
      <div><h3>Pronto</h3><div id="PRONTO"></div></div>
    </div>
  </section>


  <section id="tela-usuarios" class="tela oculta">
    <h2>Cadastro de Usuários</h2>
    <div id="erro-usuario" class="msg"></div>
    <form id="form-usuario">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" required>
      <label for="email">Email:</label>
      <input type="email" id="email" required>
      <br><button type="submit">Cadastrar</button>
    </form>
  </section>


  <section id="tela-tarefas" class="tela oculta">
    <h2 id="titulo-tarefa">Cadastro de Tarefas</h2>
    <div id="erro-tarefa" class="msg"></div>
    <form id="form-tarefa">
      <label for="descricao">Descrição:</label>
      <input type="text" id="descricao" required>
      <label for="setor">Setor:</label>
      <input type="text" id="setor" required>
      <label for="idUsuario">Usuário:</label>
      <select id="idUsuario" required>
        <option value="">Selecione</option>
      </select>
      <label for="prioridade">Prioridade:</label>
      <select id="prioridade" required>
        <option value="BAIXA">Baixa</option>
        <option value="MEDIA">Média</option>
        <option value="ALTA">Alta</option>
      </select>
      <br><button type="submit">Cadastrar</button>
    </form>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
